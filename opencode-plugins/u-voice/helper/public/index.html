<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>U-voice</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <div class="eyebrow">CLAUDE CODE · VOICE</div>
      <h1>U-voice</h1>
      <p class="intro">Talk to the coding session open in your terminal.</p>

      <div class="state-row" aria-live="polite">
        <span class="dot" id="state-dot"></span>
        <span id="state-label">Disconnected</span>
      </div>

      <div class="controls">
        <button id="connect" class="primary" type="button">Connect</button>
        <button id="mute" type="button" disabled>Mute</button>
        <button id="disconnect" class="quiet" type="button" disabled>Disconnect</button>
      </div>

      <p id="detail" class="detail" aria-live="polite">Connect when you are ready to speak.</p>
      <section id="captions" class="captions" aria-live="polite" aria-label="Recent transcript"></section>
      <audio id="remote-audio" autoplay playsinline></audio>
      <p class="privacy">Your microphone starts after the voice channel connects. Mute keeps replies audible.</p>
    </main>
  </body>
</html>
