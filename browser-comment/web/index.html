<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Comment</title>
  <style>
    :root {
      --bg: #141418;
      --panel: #1c1c22;
      --panel-2: #24242c;
      --border: #33333d;
      --text: #e4e4e7;
      --muted: #8b8b96;
      --selection: rgba(160, 160, 175, 0.22);
      --mark: rgba(212, 168, 75, 0.22);
      --mark-strong: rgba(212, 168, 75, 0.34);
      --mark-ink: #e8c47a;
      --danger: #d97a7a;
      --md-heading: #e8c47a;
      --md-link: #8ab4d4;
      --md-code: #8abeb7;
      --md-code-bg: #101014;
      --md-quote: #8b8b96;
      --md-quote-border: #3f3f4a;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }
    .hidden { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 13px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out), opacity 140ms var(--ease-out), transform 100ms var(--ease-out);
    }
    .btn:hover:not(:disabled) { border-color: #555561; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:focus-visible { border-color: rgba(255, 255, 255, 0.28); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08); outline: none; }
    .btn.primary { background: linear-gradient(180deg, #3a3a44, #2c2c34); border-color: #4a4a56; }
    .btn.primary:hover:not(:disabled) { border-color: #636372; background: linear-gradient(180deg, #42424d, #32323b); }
    .btn.ghost { background: transparent; }

    .page {
      flex: 1;
      width: 100%;
      padding: 40px 24px calc(150px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
    }

    /* centered markdown */
    .markdown {
      width: min(720px, 100%);
      line-height: 1.7;
      font-size: 15.5px;
      color: #d8d8de;
      user-select: text;
    }
    .markdown > :first-child { margin-top: 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
      color: var(--md-heading);
      line-height: 1.3;
      margin: 1.5em 0 0.55em;
      font-weight: 650;
    }
    .markdown h1 { font-size: 1.55em; }
    .markdown h2 { font-size: 1.28em; }
    .markdown h3 { font-size: 1.1em; }
    .markdown p, .markdown ul, .markdown ol, .markdown pre, .markdown blockquote { margin: 0.85em 0; }
    .markdown a { color: var(--md-link); text-decoration: none; }
    .markdown a:hover { text-decoration: underline; }
    .markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      color: var(--md-code);
      background: var(--md-code-bg);
      padding: 0.12em 0.38em;
      border-radius: 5px;
    }
    .markdown pre {
      background: var(--md-code-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 14px 16px;
      overflow: auto;
    }
    .markdown pre code { background: transparent; border: 0; padding: 0; color: var(--text); }
    .markdown blockquote {
      margin-left: 0;
      padding: 0.1em 0 0.1em 0.95em;
      border-left: 2px solid var(--md-quote-border);
      color: var(--md-quote);
    }
    .markdown hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.07); margin: 1.75em 0; }
    .markdown table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.95em; }
    .markdown th, .markdown td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
    .markdown .raw-html code { color: var(--md-code); }

    /* live selection while composing — CSS Highlights keep the DOM untouched */
    ::highlight(pi-comment-pending) {
      background: var(--selection);
      color: var(--text);
    }

    /* saved comments */
    mark.comment-mark {
      background: var(--mark);
      color: inherit;
      border-radius: 4px;
      padding: 0.05em 0.15em;
      cursor: pointer;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      box-shadow: inset 0 -1px 0 rgba(232, 196, 122, 0.35);
      transition: background 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
    }
    mark.comment-mark:focus { outline: none; }
    mark.comment-mark:focus-visible,
    mark.comment-mark:hover,
    mark.comment-mark[data-active="true"] {
      background: var(--mark-strong);
      box-shadow: inset 0 -1px 0 rgba(232, 196, 122, 0.55);
    }
    mark.comment-mark:focus-visible {
      box-shadow: inset 0 -1px 0 rgba(232, 196, 122, 0.55), 0 0 0 2px rgba(232, 196, 122, 0.22);
    }
    mark.comment-mark[data-primary="true"]::after {
      content: attr(data-num);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.15em;
      height: 1.15em;
      margin-left: 0.35em;
      padding: 0 0.32em;
      border-radius: 999px;
      background: rgba(40, 34, 18, 0.92);
      border: 1px solid rgba(232, 196, 122, 0.28);
      color: var(--mark-ink);
      font-size: 10px;
      font-weight: 650;
      vertical-align: 0.35em;
      line-height: 1;
    }

    /* floating panels */
    .popup, .note {
      position: fixed;
      z-index: 50;
      background: rgba(28, 28, 34, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px;
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: scale(0.97) translateY(4px);
      pointer-events: none;
      transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
    }
    .popup.is-open, .note.is-open {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }
    .popup {
      width: min(340px, calc(100vw - 24px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .note {
      width: min(300px, calc(100vw - 24px));
      z-index: 55;
    }

    .popup textarea, .overall-note {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(16, 16, 20, 0.9);
      color: var(--text);
      font: inherit;
      font-size: 13.5px;
      line-height: 1.45;
      padding: 10px 12px;
      outline: none;
      resize: vertical;
      transition: border-color 140ms var(--ease-out), background 140ms var(--ease-out);
    }
    .popup textarea { min-height: 84px; max-height: min(50vh, 360px); }
    .popup textarea:focus, .overall-note:focus { border-color: rgba(255, 255, 255, 0.18); outline: none; box-shadow: none; }
    .popup textarea::placeholder, .overall-note::placeholder { color: #6f6f7a; }
    .popup-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .note-head { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 8px; }
    .note-delete {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .note-delete:hover { color: var(--danger); background: rgba(217, 122, 122, 0.1); }
    .note-body {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d6d6dc;
    }

    /* fixed bottom composer */
    .composer-shell {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      padding: 20px 24px calc(14px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(20, 20, 24, 0) 0%, rgba(20, 20, 24, 0.72) 28%, rgba(20, 20, 24, 0.94) 100%);
      pointer-events: none;
    }
    .composer-inner {
      width: min(720px, 100%);
      display: flex;
      align-items: flex-end;
      gap: 10px;
      pointer-events: auto;
    }
    .composer-actions { display: flex; flex-direction: column; gap: 8px; flex: none; }
    .overall-note {
      display: block;
      flex: 1;
      min-width: 0;
      min-height: 72px;
      max-height: 160px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(22, 22, 28, 0.96);
      box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.03), 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(6px);
      background: #24242c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 60;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
    }
    .toast.is-open { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(217, 122, 122, 0.45); color: #f0c0c0; }
  </style>
</head>
<body>
  <main class="page">
    <article id="content" class="markdown"></article>
  </main>

  <div class="composer-shell">
    <div class="composer-inner">
      <textarea
        id="overall-note"
        class="overall-note"
        rows="3"
        placeholder="Overall note (optional) — general feedback not tied to a selection…"
      ></textarea>
      <div class="composer-actions">
        <button type="button" id="btn-cancel" class="btn ghost">Cancel</button>
        <button type="button" id="btn-submit" class="btn primary" disabled>Submit</button>
      </div>
    </div>
  </div>

  <div id="popup" class="popup hidden" role="dialog" aria-label="Add comment">
    <textarea id="popup-input" rows="3" placeholder="Write a comment…"></textarea>
    <div class="popup-actions">
      <button type="button" id="popup-cancel" class="btn ghost">Cancel</button>
      <button type="button" id="popup-add" class="btn primary">Add</button>
    </div>
  </div>

  <div id="note" class="note hidden" role="dialog" aria-label="Comment">
    <div class="note-head">
      <button type="button" id="note-delete" class="note-delete" title="Delete comment">Delete</button>
    </div>
    <p id="note-body" class="note-body"></p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>__MARKED_SRC__</script>
  <script>
    "use strict";
    // Replaced by the server with JSON.stringify(markdown).
    const MARKDOWN = __PI_MD__ || "";

    const contentEl = document.getElementById("content");
    const btnSubmit = document.getElementById("btn-submit");
    const btnCancel = document.getElementById("btn-cancel");
    const popup = document.getElementById("popup");
    const popupInput = document.getElementById("popup-input");
    const popupAdd = document.getElementById("popup-add");
    const popupCancel = document.getElementById("popup-cancel");
    const note = document.getElementById("note");
    const noteBody = document.getElementById("note-body");
    const noteDelete = document.getElementById("note-delete");
    const overallNoteEl = document.getElementById("overall-note");
    const toastEl = document.getElementById("toast");

    /** @type {{ id: string, selectedText: string, comment: string }[]} */
    let comments = [];
    /** @type {Range | null} */
    let pendingRange = null;
    let pendingText = "";
    let activeNoteId = null;
    let idSeq = 0;
    let done = false;

    const PENDING_HIGHLIGHT = "pi-comment-pending";

    // ─── toast ────────────────────────────────────────────────────────────
    let toastTimer = null;
    function toast(message, isError = false) {
      toastEl.textContent = message;
      toastEl.classList.toggle("error", isError);
      toastEl.classList.remove("hidden");
      void toastEl.offsetWidth;
      toastEl.classList.add("is-open");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("is-open");
        setTimeout(() => toastEl.classList.add("hidden"), 180);
      }, 2400);
    }

    // ─── markdown ─────────────────────────────────────────────────────────
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function isSafeUrl(href) {
      if (!href) return false;
      try {
        const url = new URL(href, location.origin);
        return url.protocol === "http:" || url.protocol === "https:" || url.protocol === "mailto:";
      } catch {
        return false;
      }
    }

    function getMarkedApi() {
      const root = globalThis.marked;
      if (!root) throw new Error("marked failed to load");
      if (typeof root.parse === "function") return root;
      if (root.marked && typeof root.marked.parse === "function") return root.marked;
      if (typeof root === "function") return root;
      throw new Error("Unrecognized marked export shape");
    }

    let markedApi = null;
    function renderMarkdown(source) {
      const md = (markedApi ??= getMarkedApi());
      const Renderer = md.Renderer;
      if (Renderer) {
        const renderer = new Renderer();
        // Raw HTML in the markdown is shown as escaped text, never executed.
        renderer.html = function html(token) {
          const src = token && typeof token === "object" ? token.text : token;
          const escaped = escapeHtml(src ?? "");
          return token && typeof token === "object" && token.block
            ? `<pre class="raw-html"><code>${escaped}</code></pre>`
            : escaped;
        };
        const originalLink = renderer.link.bind(renderer);
        renderer.link = function link(token) {
          if (token && typeof token === "object") {
            const href = isSafeUrl(token.href) ? token.href : "#";
            return originalLink({ ...token, href });
          }
          const href = arguments[0];
          const title = arguments[1];
          const text = arguments[2];
          return originalLink(isSafeUrl(href) ? href : "#", title, text);
        };
        if (typeof md.setOptions === "function") md.setOptions({ gfm: true, renderer });
        else if (typeof md.use === "function") md.use({ renderer });
      }
      contentEl.innerHTML = typeof md.parse === "function" ? md.parse(source || "") : md(source || "");
    }

    // ─── comment chrome ───────────────────────────────────────────────────
    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/"/g, '\\"');
    }

    function overallNote() {
      return (overallNoteEl.value || "").trim();
    }

    function canSubmit() {
      return comments.length > 0 || overallNote().length > 0;
    }

    function updateChrome() {
      const n = comments.length;
      const hasNote = overallNote().length > 0;
      btnSubmit.disabled = !canSubmit() || done;
      if (n === 0 && hasNote) btnSubmit.textContent = "Submit note";
      else if (n === 1 && !hasNote) btnSubmit.textContent = "Submit 1 comment";
      else if (n > 1 && !hasNote) btnSubmit.textContent = `Submit ${n} comments`;
      else if (n === 1) btnSubmit.textContent = "Submit 1 comment + note";
      else if (n > 1) btnSubmit.textContent = `Submit ${n} comments + note`;
      else btnSubmit.textContent = "Submit";
    }

    function renumber() {
      comments.forEach((c, i) => {
        const num = String(i + 1);
        contentEl.querySelectorAll(`mark.comment-mark[data-id="${cssEscape(c.id)}"]`).forEach((mark) => {
          mark.dataset.num = num;
          mark.setAttribute("aria-label", `Comment ${num}`);
        });
      });
    }

    function setActive(id) {
      contentEl.querySelectorAll("mark.comment-mark").forEach((el) => {
        el.dataset.active = el.dataset.id === id ? "true" : "false";
      });
    }

    function unwrapElement(el) {
      if (!el || !el.parentNode) return;
      const parent = el.parentNode;
      while (el.firstChild) parent.insertBefore(el.firstChild, el);
      parent.removeChild(el);
      parent.normalize?.();
    }

    // ─── floating panels ──────────────────────────────────────────────────
    function openFloating(el) {
      clearTimeout(el._closeTimer);
      el.classList.remove("hidden");
      void el.offsetWidth;
      el.classList.add("is-open");
    }

    function closeFloating(el, after) {
      clearTimeout(el._closeTimer);
      el.classList.remove("is-open");
      el._closeTimer = setTimeout(() => {
        el.classList.add("hidden");
        after?.();
      }, 180);
    }

    function placeFloating(el, clientX, clientY) {
      const pad = 12;
      el.style.left = "0px";
      el.style.top = "0px";
      openFloating(el);
      const rect = el.getBoundingClientRect();
      let left = clientX + 10;
      let top = clientY + 10;
      if (left + rect.width > window.innerWidth - pad) left = window.innerWidth - rect.width - pad;
      if (top + rect.height > window.innerHeight - pad) top = clientY - rect.height - 10;
      left = Math.max(pad, left);
      top = Math.max(pad, top);
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
    }

    // ─── selection → popup ────────────────────────────────────────────────
    function clearPending() {
      globalThis.CSS?.highlights?.delete(PENDING_HIGHLIGHT);
      pendingRange = null;
      pendingText = "";
    }

    function hidePopup() {
      closeFloating(popup, () => {
        clearPending();
        popupInput.value = "";
      });
      clearPending();
      popupInput.value = "";
    }

    function showPopup(clientX, clientY, text, range) {
      hideNote();
      pendingText = text;
      pendingRange = range.cloneRange();
      if (globalThis.Highlight && globalThis.CSS?.highlights) {
        globalThis.CSS.highlights.set(PENDING_HIGHLIGHT, new globalThis.Highlight(pendingRange));
      }
      window.getSelection()?.removeAllRanges();
      popupInput.value = "";
      placeFloating(popup, clientX, clientY);
      popupInput.focus();
    }

    function hideNote() {
      activeNoteId = null;
      setActive("");
      closeFloating(note);
    }

    function showNote(id, anchorEl) {
      const index = comments.findIndex((c) => c.id === id);
      if (index < 0) return;
      activeNoteId = id;
      setActive(id);
      noteBody.textContent = comments[index].comment;
      const rect = anchorEl.getBoundingClientRect();
      placeFloating(note, rect.left, rect.bottom + 6);
      noteDelete.focus();
    }

    function bindMark(mark, id) {
      mark.tabIndex = 0;
      mark.setAttribute("role", "button");
      mark.setAttribute("aria-label", `Comment ${mark.dataset.num || ""}`.trim());

      const activate = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (done) return;
        if (activeNoteId === id && note.classList.contains("is-open")) {
          hideNote();
          mark.focus();
          return;
        }
        showNote(id, mark);
      };

      mark.addEventListener("click", activate);
      mark.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") activate(e);
      });
    }

    /** Wrap the pending selection in <mark> segments without restructuring the document. */
    function promoteToMarks(id, num) {
      if (!pendingRange) return;
      const range = pendingRange.cloneRange();
      clearPending();

      const segments = [];
      const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (!node.textContent?.trim() || node.parentElement?.closest("mark.comment-mark")) continue;
        if (!range.intersectsNode(node)) continue;

        const start = node === range.startContainer ? range.startOffset : 0;
        const end = node === range.endContainer ? range.endOffset : node.textContent.length;
        if (start < end) segments.push({ node, start, end });
      }

      let marks = [];
      for (const segment of segments.reverse()) {
        const { node, start, end } = segment;
        if (end < node.textContent.length) node.splitText(end);
        const selected = start > 0 ? node.splitText(start) : node;
        const mark = document.createElement("mark");
        mark.className = "comment-mark";
        mark.dataset.id = id;
        mark.dataset.num = String(num);
        selected.parentNode?.insertBefore(mark, selected);
        mark.appendChild(selected);
        bindMark(mark, id);
        marks.push(mark);
      }

      marks = marks.reverse();
      if (marks[0]) marks[0].dataset.primary = "true";
    }

    function removeComment(id) {
      comments = comments.filter((c) => c.id !== id);
      contentEl.querySelectorAll(`mark.comment-mark[data-id="${cssEscape(id)}"]`).forEach(unwrapElement);
      if (activeNoteId === id) hideNote();
      renumber();
      updateChrome();
    }

    function addComment() {
      const text = pendingText.trim();
      const comment = popupInput.value.trim();
      if (!text) {
        toast("Select some text first", true);
        return;
      }
      if (!comment) {
        toast("Write a comment", true);
        popupInput.focus();
        return;
      }

      const id = `c${++idSeq}`;
      comments.push({ id, selectedText: text, comment });

      try {
        promoteToMarks(id, comments.length);
      } catch {
        clearPending();
      }

      hidePopup();
      renumber();
      updateChrome();
      // Return focus to the new mark for continued keyboard flow.
      const mark = contentEl.querySelector(`mark.comment-mark[data-id="${cssEscape(id)}"]`);
      mark?.focus();
    }

    // ─── submit / cancel ──────────────────────────────────────────────────
    async function post(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body ?? {}),
      });
      let data = null;
      try {
        data = await res.json();
      } catch {
        // ignore
      }
      if (!res.ok) {
        throw new Error((data && data.error) || `Request failed (${res.status})`);
      }
      return data;
    }

    function tryCloseTab() {
      try {
        window.close();
      } catch {
        // best-effort; browsers may ignore if the tab wasn't script-opened
      }
    }

    async function submit() {
      if (done) return;
      if (!canSubmit()) {
        toast("Add a selection comment or overall note", true);
        return;
      }
      try {
        btnSubmit.disabled = true;
        await post("/submit", { comments, overallNote: overallNote() });
        done = true;
        hidePopup();
        hideNote();
        overallNoteEl.disabled = true;
        btnSubmit.disabled = true;
        btnCancel.disabled = true;
        tryCloseTab();
      } catch (err) {
        btnSubmit.disabled = false;
        toast(err instanceof Error ? err.message : String(err), true);
      }
    }

    async function cancel() {
      if (done) return;
      try {
        await post("/cancel", {});
        done = true;
        hidePopup();
        hideNote();
        overallNoteEl.disabled = true;
        btnSubmit.disabled = true;
        btnCancel.disabled = true;
        tryCloseTab();
      } catch (err) {
        toast(err instanceof Error ? err.message : String(err), true);
      }
    }

    // ─── events ───────────────────────────────────────────────────────────
    function onMouseUp(event) {
      if (done) return;
      if (popup.contains(event.target) || note.contains(event.target)) return;
      if (event.target.closest?.("mark.comment-mark")) return;
      if (event.target.closest?.(".composer-shell")) return;

      setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;

        const range = sel.getRangeAt(0);
        if (!contentEl.contains(range.commonAncestorContainer)) return;

        const text = sel.toString().trim();
        if (!text) return;

        const startEl =
          range.startContainer.nodeType === Node.ELEMENT_NODE
            ? range.startContainer
            : range.startContainer.parentElement;
        if (startEl?.closest?.("mark.comment-mark")) return;

        showPopup(event.clientX, event.clientY, text, range.cloneRange());
      }, 0);
    }

    function isModEnter(e) {
      return e.key === "Enter" && (e.metaKey || e.ctrlKey);
    }

    function boot() {
      renderMarkdown(MARKDOWN);
      updateChrome();

      contentEl.addEventListener("mouseup", onMouseUp);
      popupAdd.addEventListener("click", addComment);
      popupCancel.addEventListener("click", hidePopup);
      btnSubmit.addEventListener("click", () => void submit());
      btnCancel.addEventListener("click", () => void cancel());
      noteDelete.addEventListener("click", () => {
        if (activeNoteId) removeComment(activeNoteId);
      });
      overallNoteEl.addEventListener("input", updateChrome);

      // Popup: Enter adds, Shift+Enter newline, Esc closes, Cmd/Ctrl+Enter submits.
      popupInput.addEventListener("keydown", (e) => {
        if (isModEnter(e)) {
          e.preventDefault();
          void submit();
          return;
        }
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          addComment();
        } else if (e.key === "Escape") {
          e.preventDefault();
          hidePopup();
        }
      });

      // Overall note: Cmd/Ctrl+Enter submits everything.
      overallNoteEl.addEventListener("keydown", (e) => {
        if (isModEnter(e)) {
          e.preventDefault();
          void submit();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (isModEnter(e) && !popup.classList.contains("is-open")) {
          const tag = (e.target && e.target.tagName) || "";
          if (tag === "TEXTAREA" || tag === "INPUT") return;
          e.preventDefault();
          void submit();
          return;
        }
        if (e.key === "Escape") {
          if (popup.classList.contains("is-open")) hidePopup();
          else if (note.classList.contains("is-open")) hideNote();
        }
      });

      // Click outside closes popup / note.
      document.addEventListener("mousedown", (e) => {
        if (popup.classList.contains("is-open") && !popup.contains(e.target)) hidePopup();
        if (
          note.classList.contains("is-open") &&
          !note.contains(e.target) &&
          !e.target.closest?.("mark.comment-mark")
        ) {
          hideNote();
        }
      });
    }

    try {
      boot();
    } catch (err) {
      contentEl.textContent = err instanceof Error ? err.message : String(err);
    }
  </script>
</body>
</html>
