[package]
name = "open-typeless"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Turns a raw dictation transcript into clean, structured text without changing what was said."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "=3.5.2", features = ["json"] }

[profile.release]
lto = true
strip = true
